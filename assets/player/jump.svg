<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <linearGradient id="skinGradJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="hairGradJump" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shirtGradJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="scarfGradJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pantsGradJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bootGradJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="softShadowJump" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadowJump)">
    <!-- HAI CH N CO LÊN CAO KHI NHẢY -->
    <!-- Chân trái co gối -->
    <path d="M 24 50 L 16 66 L 22 72 L 30 56 Z" fill="#1e293b"/>
    <path d="M 16 66 L 14 78 C 12 80 18 82 20 79 L 22 72 Z" fill="url(#bootGradJump)"/>

    <!-- Chân phải duỗi chéo tạo tư thế phi thân -->
    <path d="M 32 50 L 46 64 L 42 70 L 28 54 Z" fill="url(#pantsGradJump)"/>
    <path d="M 46 64 L 54 74 C 56 76 50 78 48 75 L 42 70 Z" fill="url(#bootGradJump)"/>

    <!-- TH N NGƯỜI VƯƠN CAO -->
    <path d="M 22 28 L 16 48 L 24 50 L 26 56 L 42 54 L 44 48 L 50 46 L 44 26 Z" fill="url(#shirtGradJump)"/>
    
    <!-- HAI TAY GIƯƠNG CAO HƯỚNG VỀ PHÍA TRƯỚC VÀ TRÊN -->
    <path d="M 20 29 L 10 14 C 8 12 12 10 14 12 L 24 27 Z" fill="#78350f"/>
    <circle cx="10" cy="12" r="3.5" fill="url(#skinGradJump)"/>

    <path d="M 44 28 L 54 16 C 56 14 60 16 58 18 L 48 30 Z" fill="#92400e"/>
    <circle cx="56" cy="16" r="3.5" fill="url(#skinGradJump)"/>

    <!-- CÚC ÁO -->
    <line x1="33" y1="30" x2="33" y2="54" stroke="#451a03" stroke-width="1.2"/>
    <circle cx="33" cy="35" r="1" fill="#fde047"/>
    <circle cx="33" cy="41" r="1" fill="#fde047"/>
    <circle cx="33" cy="47" r="1" fill="#fde047"/>

    <!-- ĐẦU NGẨNG CAO KIÊN ĐỊNH -->
    <ellipse cx="33" cy="16" rx="9" ry="11" fill="url(#skinGradJump)"/>
    
    <path d="M 35 12 Q 38 10 41 12" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <ellipse cx="38" cy="14.5" rx="1.5" ry="1.8" fill="#1c1917"/>
    <circle cx="38.6" cy="14" r="0.6" fill="#fff"/>
    <path d="M 40 17 L 41 19 L 39 19.5" stroke="#ea580c" stroke-width="0.8" fill="none"/>
    <path d="M 36 22 Q 39 23.5 41 22" stroke="#9a3412" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- TÓC BAY NGƯỢC VỀ PHÍA SAU -->
    <path d="M 23 15 C 20 5 28 4 33 4 C 37 4 44 6 43 13 C 41 9 35 8 33 9 C 31 8 25 9 23 15 Z" fill="url(#hairGradJump)"/>

    <!-- KHĂN QUÀNG ĐỎ BAY CUỘN SÓNG DƯỚI GIÓ -->
    <path d="M 27 25 C 29 23 37 23 39 25 C 41 27 40 31 37 30 C 34 29 29 29 27 25 Z" fill="url(#scarfGradJump)"/>
    <path d="M 28 27 C 20 30 14 36 8 40 C 14 42 22 38 27 32 Z" fill="#ef4444"/>
    <path d="M 29 29 C 22 34 16 42 12 46 C 18 47 24 42 28 34 Z" fill="#dc2626"/>
  </g>
</svg>

