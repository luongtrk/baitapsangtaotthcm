<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <linearGradient id="skinGradCrouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="hairGradCrouch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shirtGradCrouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="scarfGradCrouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pantsGradCrouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bootGradCrouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="softShadowCrouch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadowCrouch)">
    <!-- BÓNG ĐỔ DÀI KHI TRƯỢT SÁT ĐẤT -->
    <ellipse cx="32" cy="92" rx="26" ry="4" fill="rgba(0,0,0,0.35)"/>

    <!-- TƯ THẾ QUỲ GỐI & TRƯỢT SÁT ĐẤT (CROUCH / SLIDE) -->
    <!-- Chân sau quỳ sát đất -->
    <path d="M 12 76 L 24 76 L 36 84 L 14 84 Z" fill="#1e293b"/>
    <path d="M 8 82 C 8 80 14 80 15 82 L 16 90 C 16 92 8 92 7 90 Z" fill="url(#bootGradCrouch)"/>

    <!-- Chân trước co gập gối tạo góc nhọn -->
    <path d="M 28 66 L 44 76 L 38 88 L 22 78 Z" fill="url(#pantsGradCrouch)"/>
    <path d="M 38 88 L 48 90 C 50 92 42 93 40 90 L 36 86 Z" fill="url(#bootGradCrouch)"/>

    <!-- TH N NGƯỜI HẠ THẤP SÁT ĐẤT -->
    <path d="M 20 54 L 16 70 L 24 74 L 28 78 L 44 76 L 46 70 L 50 66 L 44 52 Z" fill="url(#shirtGradCrouch)"/>
    
    <!-- TAY CHỐNG XUỐNG ĐẤT THĂNG BẰNG -->
    <path d="M 22 56 L 16 78 C 14 80 18 82 20 80 L 26 58 Z" fill="#78350f"/>
    <circle cx="16" cy="82" r="3.5" fill="url(#skinGradCrouch)"/>

    <!-- TAY TRƯỚC CO GẬP BẢO VỆ -->
    <path d="M 42 54 L 48 68 C 50 70 54 68 52 66 L 46 52 Z" fill="#92400e"/>
    <circle cx="50" cy="70" r="3.5" fill="url(#skinGradCrouch)"/>

    <!-- ĐẦU HẠ THẤP, MẮT NHÌN XUYÊN BÓNG TỐI -->
    <ellipse cx="36" cy="42" rx="9" ry="10" fill="url(#skinGradCrouch)"/>
    
    <path d="M 38 38 Q 41 36 44 38" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <ellipse cx="41" cy="40.5" rx="1.5" ry="1.7" fill="#1c1917"/>
    <circle cx="41.6" cy="40" r="0.6" fill="#fff"/>
    <path d="M 43 43 L 44 45 L 42 45.5" stroke="#ea580c" stroke-width="0.8" fill="none"/>
    <path d="M 39 48 Q 42 49 44 48" stroke="#9a3412" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- TÓC GỌN GÀNG -->
    <path d="M 26 40 C 23 30 31 29 36 29 C 40 29 47 31 46 38 C 44 34 38 33 36 34 C 34 33 28 34 26 40 Z" fill="url(#hairGradCrouch)"/>

    <!-- KHĂN QUÀNG ĐỎ BUỘC GỌN TRÁNH BỊ PHÁT HIỆN -->
    <path d="M 28 50 C 30 48 38 48 40 50 C 42 52 41 56 38 55 C 35 54 30 54 28 50 Z" fill="url(#scarfGradCrouch)"/>
    <path d="M 30 52 L 27 60 L 31 59 L 32 53 Z" fill="#ef4444"/>
    <path d="M 32 53 L 34 60 L 37 58 L 34 52 Z" fill="#dc2626"/>
  </g>
</svg>

