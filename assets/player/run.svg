<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <linearGradient id="skinGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="hairGradRun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shirtGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="scarfGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pantsGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bootGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="softShadowRun" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadowRun)">
    <!-- BÓNG ĐỔ DI CHUYỂN -->
    <ellipse cx="32" cy="92" rx="18" ry="4" fill="rgba(0,0,0,0.3)"/>

    <!-- CH N TRƯỚC VÀ CH N SAU ĐANG SẢI BƯỚC -->
    <!-- Chân sau co lại -->
    <path d="M 28 58 L 14 74 L 18 78 L 32 62 Z" fill="#1e293b"/>
    <path d="M 14 74 L 10 88 C 8 90 14 91 16 88 L 18 78 Z" fill="url(#bootGradRun)"/>

    <!-- Chân trước vươn tới -->
    <path d="M 32 58 L 44 76 L 38 80 L 28 62 Z" fill="url(#pantsGradRun)"/>
    <path d="M 44 76 L 50 88 C 52 90 46 91 44 88 L 38 80 Z" fill="url(#bootGradRun)"/>

    <!-- TH N NGƯỜI NGHIÊNG NHẸ VỀ PHÍA TRƯỚC -->
    <path d="M 22 35 L 17 55 L 24 58 L 26 63 L 44 61 L 46 55 L 52 52 L 46 34 Z" fill="url(#shirtGradRun)"/>
    
    <!-- TAY SAU VUNG VỀ SAU -->
    <path d="M 20 37 L 8 48 C 6 50 10 53 12 51 L 22 41 Z" fill="#78350f"/>
    <circle cx="8" cy="50" r="3.5" fill="url(#skinGradRun)"/>

    <!-- TAY TRƯỚC VUNG VỀ TRƯỚC -->
    <path d="M 44 36 L 56 46 C 58 48 54 52 52 50 L 42 41 Z" fill="#92400e"/>
    <circle cx="56" cy="48" r="3.5" fill="url(#skinGradRun)"/>

    <!-- CÚC ÁO -->
    <line x1="34" y1="37" x2="33" y2="61" stroke="#451a03" stroke-width="1.2"/>
    <circle cx="34" cy="42" r="1" fill="#fde047"/>
    <circle cx="34" cy="48" r="1" fill="#fde047"/>
    <circle cx="33" cy="54" r="1" fill="#fde047"/>

    <!-- CỔ -->
    <rect x="31" y="27" width="6" height="8" rx="2" fill="url(#skinGradRun)" transform="rotate(6 34 31)"/>

    <!-- ĐẦU HƯỚNG VỀ PHÍA TRƯỚC -->
    <ellipse cx="35" cy="20" rx="9" ry="11" fill="url(#skinGradRun)"/>
    
    <!-- MẮT & LÔNG MÀY QUYẾT T M -->
    <path d="M 36 15 Q 39 14 42 16" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <ellipse cx="39" cy="18.5" rx="1.5" ry="1.8" fill="#1c1917"/>
    <circle cx="39.6" cy="18" r="0.6" fill="#fff"/>
    <path d="M 41 21 L 42 23 L 40 23.5" stroke="#ea580c" stroke-width="0.8" fill="none"/>
    <path d="M 37 26 Q 40 27.5 42 26" stroke="#9a3412" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- TÓC BAY THEO GIÓ -->
    <path d="M 25 18 C 22 8 30 7 35 7 C 39 7 46 9 45 16 C 43 12 37 11 35 12 C 33 11 27 12 25 18 Z" fill="url(#hairGradRun)"/>

    <!-- KHĂN QUÀNG ĐỎ BAY PHẤP PHỚI VỀ PHÍA SAU -->
    <path d="M 28 31 C 30 29 38 29 40 31 C 42 33 41 37 38 36 C 35 35 30 35 28 31 Z" fill="url(#scarfGradRun)"/>
    <!-- Dải khăn bay ngược về sau -->
    <path d="M 30 33 C 24 33 18 36 12 34 C 18 38 24 40 29 36 Z" fill="#ef4444"/>
    <path d="M 29 35 C 22 36 16 41 10 40 C 17 44 23 45 28 38 Z" fill="#dc2626"/>
  </g>
</svg>

