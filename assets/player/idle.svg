<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <!-- Gradients for realistic fabric & skin shading -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- BÓNG ĐỔ DƯỚI CH N -->
    <ellipse cx="32" cy="92" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>

    <!-- CH N TRÁI & PHẢI -->
    <!-- Quần tây vải sẫm -->
    <path d="M 23 58 L 22 84 L 29 84 L 31 58 Z" fill="url(#pantsGrad)"/>
    <path d="M 33 58 L 35 84 L 42 84 L 40 58 Z" fill="url(#pantsGrad)"/>
    <!-- Đường nếp quần -->
    <line x1="26" y1="58" x2="25" y2="84" stroke="#0f172a" stroke-width="0.8" opacity="0.6"/>
    <line x1="38" y1="58" x2="39" y2="84" stroke="#0f172a" stroke-width="0.8" opacity="0.6"/>

    <!-- GIÀY CỔ CAO / GIÀY DA -->
    <path d="M 20 83 C 20 81 29 81 30 83 L 31 90 C 31 92 20 92 19 90 Z" fill="url(#bootGrad)"/>
    <path d="M 33 83 C 33 81 42 81 43 83 L 44 90 C 44 92 33 92 32 90 Z" fill="url(#bootGrad)"/>

    <!-- TH N ÁO BÀ BA / SƠ MI KÝ GIẢ NÂU TRUYỀN THỐNG -->
    <path d="M 20 34 L 14 54 L 21 56 L 22 62 L 42 62 L 43 56 L 50 54 L 44 34 Z" fill="url(#shirtGrad)"/>
    
    <!-- TAY ÁO TRÁI & PHẢI -->
    <path d="M 14 34 L 9 52 C 9 54 13 56 15 54 L 19 38 Z" fill="#92400e"/>
    <path d="M 45 34 L 50 52 C 50 54 54 54 55 52 L 50 36 Z" fill="#78350f"/>
    <!-- Bàn tay -->
    <circle cx="12" cy="55" r="3.5" fill="url(#skinGrad)"/>
    <circle cx="52" cy="55" r="3.5" fill="url(#skinGrad)"/>

    <!-- VẠT ÁO & CÚC ÁO TRUYỀN THỐNG -->
    <line x1="32" y1="36" x2="32" y2="62" stroke="#451a03" stroke-width="1.2"/>
    <circle cx="32" cy="40" r="1" fill="#fde047"/>
    <circle cx="32" cy="46" r="1" fill="#fde047"/>
    <circle cx="32" cy="52" r="1" fill="#fde047"/>
    <circle cx="32" cy="58" r="1" fill="#fde047"/>
    
    <!-- CỔ ÁO & CỔ -->
    <rect x="29" y="27" width="6" height="8" rx="2" fill="url(#skinGrad)"/>

    <!-- ĐẦU & KHUÔN MẶT THANH TÚ -->
    <ellipse cx="32" cy="20" rx="9" ry="11" fill="url(#skinGrad)"/>
    
    <!-- MẮT & LÔNG MÀY CƯƠNG TRỰC -->
    <path d="M 33 16 Q 36 15 39 16" stroke="#1c1917" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="36" cy="19" rx="1.5" ry="1.8" fill="#1c1917"/>
    <circle cx="36.5" cy="18.5" r="0.6" fill="#fff"/> <!-- Điểm sáng mắt -->
    <!-- Mũi & Miệng cười mỉm kiên nghị -->
    <path d="M 38 21 L 39 23 L 37 23.5" stroke="#ea580c" stroke-width="0.8" fill="none"/>
    <path d="M 34 26 Q 37 27.5 39 26" stroke="#9a3412" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- MÁI TÓC ĐEN RẼ NGÔI LÃNH TỤ THỜI TRẺ -->
    <path d="M 23 18 C 21 8 28 8 32 8 C 36 8 43 9 42 16 C 40 12 34 11 32 12 C 30 11 25 12 23 18 Z" fill="url(#hairGrad)"/>
    <path d="M 23 18 C 23 23 25 24 25 24 C 23 21 23 19 23 18 Z" fill="#1c1917"/> <!-- Tóc mai -->

    <!-- KHĂN QUÀNG ĐỎ CÁCH MẠNG PHẤP PHỚI -->
    <path d="M 26 31 C 28 29 36 29 38 31 C 40 33 39 37 36 36 C 33 35 28 35 26 31 Z" fill="url(#scarfGrad)"/>
    <!-- Hai dải khăn quàng rủ trước ngực -->
    <path d="M 30 34 L 27 46 L 31 45 L 32 35 Z" fill="#ef4444"/>
    <path d="M 32 35 L 34 44 L 37 42 L 34 34 Z" fill="#dc2626"/>
    <!-- Nút thắt khăn vàng nhỏ điểm xuyết -->
    <polygon points="31,34 33,32 35,34 33,36" fill="#fde047"/>
  </g>
</svg>

